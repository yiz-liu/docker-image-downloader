name: Download Docker Image
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Pull Image
        run: docker pull --platform linux/arm64 library/ubuntu:26.04

      - name: Save and Compress Image
        run: |
          docker save library/ubuntu:26.04 | gzip > ubuntu-26.04-arm64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu
          path: ubuntu-26.04-arm64.tar.gz
          retention-days: 1
